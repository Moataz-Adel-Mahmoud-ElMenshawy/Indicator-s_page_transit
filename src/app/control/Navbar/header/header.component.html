<div class="header">
  <!-- Logo Section -->
  <div class="logo">
    <img src="assets/ministryOfTransLogo 1.png" alt="GTFS Logo" />
  </div>

  <h3>
    {{'Ministry of Transportation'|translate}}
  </h3>

  <div class="navigate-buttons">
    @for(link of NavigationLinks; track link.name){
      <a class="nav-item" [routerLink]="link.name" routerLinkActive="active">
        {{link.label | translate}}
      </a>
    }
  </div>
</div>
